<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Furnish</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root { --moss:#23301F; --moss-light:#48593F; --linen:#F5F0E6; --linen-deep:#EBE3D3; --brass:#B78A1E; --brass-soft:#E7CE8C; --taupe:#8A7960; --line:rgba(27,32,24,.14); --ink:#1B2018; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--linen); color:var(--ink); font-family: ui-sans-serif, system-ui, sans-serif; }
  header { background:var(--moss); color:var(--linen); padding:18px 28px; display:flex; justify-content:space-between; align-items:center; }
  header .brand { font-weight:700; font-size:17px; }
  header form button { background:transparent; border:1px solid rgba(245,240,230,.4); color:var(--linen); padding:8px 16px; border-radius:2px; font-size:12px; cursor:pointer; }
  .layout { display:flex; min-height:calc(100vh - 60px); }
  nav.side { width:200px; background:#fff; border-right:1px solid var(--line); padding:20px 0; }
  nav.side button { display:block; width:100%; text-align:left; padding:12px 24px; border:none; background:transparent; font-size:13px; font-weight:600; color:var(--moss); cursor:pointer; border-left:3px solid transparent; }
  nav.side button.active { border-left-color:var(--brass); background:var(--linen-deep); }
  main { flex:1; padding:32px; max-width:1100px; }
  h2 { font-size:20px; margin:0 0 20px; }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:32px; }
  .stat { background:#fff; border:1px solid var(--line); padding:18px; }
  .stat b { display:block; font-size:24px; }
  .stat span { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--taupe); }
  .charts-grid { display:grid; grid-template-columns:1.4fr 1fr; gap:20px; margin-top:8px; }
  .chart-card { background:#fff; border:1px solid var(--line); padding:20px; }
  .chart-card h3 { font-size:14px; margin:0 0 14px; color:var(--moss); }
  @media (max-width: 900px) { .charts-grid { grid-template-columns:1fr; } }
  table { width:100%; border-collapse:collapse; background:#fff; }
  th, td { text-align:left; padding:10px 12px; font-size:13px; border-bottom:1px solid var(--line); }
  th { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--taupe); }
  .pill { font-size:11px; padding:3px 9px; border-radius:99px; background:var(--linen-deep); text-transform:capitalize; }
  .btn { padding:6px 12px; font-size:12px; border-radius:2px; border:1px solid var(--line); background:#fff; cursor:pointer; margin-right:6px; }
  .btn.danger { color:#B23A3A; border-color:#B23A3A; }
  .btn.primary { background:var(--moss); color:var(--linen); border-color:var(--moss); }
  .panel { display:none; }
  .panel.active { display:block; }
  .modal-bg { display:none; position:fixed; inset:0; background:rgba(27,32,24,.5); align-items:center; justify-content:center; z-index:10; }
  .modal-bg.open { display:flex; }
  .modal { background:#fff; padding:28px; width:100%; max-width:460px; max-height:88vh; overflow:auto; }
  .modal h3 { margin:0 0 18px; }
  .field { margin-bottom:14px; }
  .field label { display:block; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--taupe); margin-bottom:6px; }
  .field input, .field textarea, .field select { width:100%; padding:9px 11px; border:1px solid var(--line); font-size:13px; font-family:inherit; }
  .field textarea { min-height:70px; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .modal-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:18px; }
  select.status-select { padding:5px 8px; font-size:12px; border:1px solid var(--line); }

  /* ---- orders (advanced) ---- */
  .orders-toolbar { display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:20px; }
  .orders-search { flex:1; min-width:220px; padding:10px 14px; border:1px solid var(--line); border-radius:2px; font-size:13px; font-family:inherit; }
  .orders-filters { display:flex; gap:6px; flex-wrap:wrap; }
  .order-filter-chip { padding:7px 14px; border:1px solid var(--line); border-radius:999px; background:#fff; font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--moss); cursor:pointer; }
  .order-filter-chip.active { background:var(--moss); color:var(--linen); border-color:var(--moss); }
  .order-empty { color:var(--taupe); font-size:13px; padding:24px 0; }

  .order-card { background:#fff; border:1px solid var(--line); margin-bottom:16px; overflow:hidden; }
  .order-card-head { display:flex; justify-content:space-between; align-items:flex-start; gap:16px; padding:16px 20px; background:var(--linen-deep); flex-wrap:wrap; }
  .order-card-id { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--taupe); }
  .order-card-date { font-size:12px; color:var(--taupe); }
  .order-card-total { font-family:var(--font-display); font-size:20px; color:var(--moss); }
  .order-card-body { display:grid; grid-template-columns:1.1fr 1fr 1fr; gap:0; }
  .order-card-col { padding:16px 20px; border-right:1px solid var(--line); }
  .order-card-col:last-child { border-right:none; }
  .order-card-label { font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--taupe); margin-bottom:8px; }
  .order-customer-name { font-weight:700; font-size:15px; color:var(--moss); margin-bottom:4px; }
  .order-customer-detail { font-size:12px; color:var(--taupe); line-height:1.6; }
  .order-address { font-size:13px; line-height:1.5; }
  .order-items-list { font-size:13px; line-height:1.8; }
  .order-card-footer { display:flex; justify-content:space-between; align-items:center; padding:12px 20px; border-top:1px solid var(--line); flex-wrap:wrap; gap:10px; }
  .payment-badge { font-size:11px; font-weight:700; padding:5px 12px; border-radius:999px; }
  .payment-badge.paid { background:#DCEFDD; color:#2E7D32; }
  .payment-badge.unpaid { background:var(--linen-deep); color:var(--taupe); }
  @media (max-width: 900px) { .order-card-body { grid-template-columns:1fr; } .order-card-col { border-right:none; border-bottom:1px solid var(--line); } }

  @media (max-width: 720px) {
  .layout { flex-direction: column; }
  nav.side { width: 100%; display: flex; overflow-x: auto; border-right: none; border-bottom: 1px solid var(--line); padding: 0; }
  nav.side button { white-space: nowrap; border-left: none; border-bottom: 3px solid transparent; }
  nav.side button.active { border-bottom-color: var(--brass); }
  main { padding: 20px; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  table { display: block; overflow-x: auto; white-space: nowrap; }
}


.charts-grid { display:grid; grid-template-columns:1.4fr 1fr; gap:20px; margin-top:8px; }
.chart-card { background:#fff; border:1px solid var(--line); padding:20px; }
.chart-card h3 { font-size:14px; margin:0 0 14px; color:var(--moss); }
@media (max-width: 900px) { .charts-grid { grid-template-columns:1fr; } }

</style>
</head>
<body>

<header>
  <span class="brand">Furnish Admin</span>
  <form method="POST" action="/admin/logout"><button type="submit">Log out</button></form>
</header>

<div class="layout">
  <nav class="side">
    <button data-tab="overview" class="active">Overview</button>
    <button data-tab="products">Products</button>
    <button data-tab="orders">Orders</button>
    <button data-tab="messages">Messages</button>
  </nav>

  <main>
    <section id="panel-overview" class="panel active">
      <h2>Overview</h2>
      <div class="stats" id="stats"></div>
      <div class="charts-grid">
        <div class="chart-card">
          <h3>Orders — last 14 days</h3>
          <canvas id="orders-chart" height="200"></canvas>
        </div>
        <div class="chart-card">
          <h3>Orders by status</h3>
          <canvas id="status-chart" height="200"></canvas>
        </div>
      </div>
      <p style="color:var(--taupe); font-size:13px; margin-top:24px;">This dashboard is not linked from the public site and requires login. Bookmark <code>/admin</code> to return.</p>
    </section>

    <section id="panel-products" class="panel">
      <h2 style="display:flex; justify-content:space-between; align-items:center;">
        Products
        <button class="btn primary" id="new-product-btn">+ New product</button>
        <button class="btn" id="new-combo-btn" type="button" style="margin-left:8px; background:#2E7D32; color:#fff; border-color:#2E7D32;">+ New Combo</button>
      </h2>
      <table>
        <thead><tr><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Featured</th><th></th></tr></thead>
        <tbody id="products-table"></tbody>
      </table>
    </section>

    <section id="panel-orders" class="panel">
      <h2>Orders</h2>
      <div class="orders-toolbar">
        <input type="text" class="orders-search" id="orders-search" placeholder="Search by name, email, phone or order ID…">
        <div class="orders-filters" id="orders-filters">
          <button class="order-filter-chip active" data-status="">All</button>
          <button class="order-filter-chip" data-status="pending">Pending</button>
          <button class="order-filter-chip" data-status="processing">Processing</button>
          <button class="order-filter-chip" data-status="shipped">Shipped</button>
          <button class="order-filter-chip" data-status="delivered">Delivered</button>
          <button class="order-filter-chip" data-status="cancelled">Cancelled</button>
        </div>
      </div>
      <div id="orders-list"></div>
    </section>

    

    <section id="panel-messages" class="panel">
      <h2>Contact messages</h2>
      <table>
        <thead><tr><th>Name</th><th>Email</th><th>Message</th><th>Sent</th></tr></thead>
        <tbody id="messages-table"></tbody>
      </table>
    </section>
  </main>
</div>

<!-- Product create/edit modal -->
<div class="modal-bg" id="product-modal-bg">
  <div class="modal" style="max-width:580px;">
    <h3 id="product-modal-title">New product</h3>
    <form id="product-form">
      <input type="hidden" id="p-id">
      <div class="row2">
        <div class="field"><label>Name</label><input type="text" id="p-name" required oninput="document.getElementById('p-slug').value = this.value.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');"></div>
        <div class="field"><label>Slug</label><input type="text" id="p-slug" required></div>
      </div>
      <div class="row2">
        <div class="field"><label>Category</label><input type="text" id="p-category" required placeholder="Bedroom, Living Room, Pooja, Combos..."></div>
        <div class="field"><label>Material</label><input type="text" id="p-material" required></div>
      </div>
      <div class="field">
        <label>Type (for combo swaps, e.g. Cot, Wardrobe, Sofa. Leave blank for combo products.)</label>
        <input type="text" id="p-type" placeholder="e.g. Cot">
      </div>
      <div class="field"><label>Description</label><textarea id="p-description" required></textarea></div>
      <div class="row2">
        <div class="field"><label>Price (₹)</label><input type="number" step="0.01" id="p-price" required></div>
        <div class="field"><label>Compare-at price (₹, optional)</label><input type="number" step="0.01" id="p-compare"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Stock</label><input type="number" id="p-stock" value="20"></div>
        <div class="field"><label>Image path</label><input type="text" id="p-image" placeholder="/images/products/example.svg"></div>
      </div>
      <div class="field">
        <label><input type="checkbox" id="p-featured" style="width:auto; margin-right:8px;">Featured on homepage</label>
      </div>

      <div id="combo-builder-admin" style="display:none; border-top:1px solid var(--line); margin-top:6px; padding-top:16px;">
        <label style="display:block; margin-bottom:10px;">Combo items — customers can swap each for another product of the same type</label>
        <div id="combo-items-rows"></div>
        <button type="button" class="btn btn-sm" id="combo-add-item-btn" style="margin-top:4px;">+ Add item</button>
      </div>

      <div id="product-error" style="color:#B23A3A; font-size:12px; margin-top:12px;"></div>
      <div class="modal-actions">
        <button type="button" class="btn" id="product-cancel-btn">Cancel</button>
        <button type="submit" class="btn primary">Save product</button>
      </div>
    </form>
  </div>
</div>

<script>
const api = (path, opts = {}) => fetch(`/api/admin${path}`, {
  headers: { 'Content-Type': 'application/json' }, ...opts
}).then(async r => {
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'Request failed');
  return data;
});

/* ---------- tabs ---------- */
document.querySelectorAll('nav.side button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav.side button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(`panel-${btn.dataset.tab}`).classList.add('active');
    loadTab(btn.dataset.tab);
  });
});

function loadTab(tab) {
  if (tab === 'overview') loadStats();
  if (tab === 'products') loadProducts();
  if (tab === 'orders') loadOrders();
  if (tab === 'messages') loadMessages();
}

/* ---------- overview ---------- */
let ordersChartInstance = null;
let statusChartInstance = null;

async function loadStats() {
  const s = await api('/stats');
  document.getElementById('stats').innerHTML = `
    <div class="stat"><b>${s.productCount}</b><span>Products</span></div>
    <div class="stat"><b>${s.orderCount}</b><span>Orders</span></div>
    <div class="stat"><b>\u20b9${s.revenue.toLocaleString('en-IN')}</b><span>Revenue</span></div>
    <div class="stat"><b>${s.subscriberCount}</b><span>Subscribers</span></div>`;

  renderOrdersChart(s.ordersByDay || []);
  renderStatusChart(s.statusBreakdown || []);
}

function renderOrdersChart(ordersByDay) {
  const days = [];
  for (let i = 13; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    days.push(d.toISOString().slice(0, 10));
  }
  const byDate = Object.fromEntries(ordersByDay.map(d => [d._id, d]));
  const labels = days.map(d => new Date(d).toLocaleDateString('en-IN', { day: 'numeric', month: 'short' }));
  const counts = days.map(d => byDate[d]?.count || 0);

  const ctx = document.getElementById('orders-chart');
  if (ordersChartInstance) ordersChartInstance.destroy();
  ordersChartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        label: 'Orders',
        data: counts,
        backgroundColor: '#B78A1E',
        borderRadius: 3
      }]
    },
    options: {
      plugins: { legend: { display: false } },
      scales: {
        y: { beginAtZero: true, ticks: { precision: 0 } },
        x: { grid: { display: false } }
      }
    }
  });
}

function renderStatusChart(statusBreakdown) {
  const colors = {
    pending: '#8A7960',
    processing: '#B78A1E',
    shipped: '#48593F',
    delivered: '#23301F',
    cancelled: '#B23A3A'
  };
  const labels = statusBreakdown.map(s => s._id);
  const data = statusBreakdown.map(s => s.count);
  const backgroundColor = labels.map(l => colors[l] || '#ccc');

  const ctx = document.getElementById('status-chart');
  if (statusChartInstance) statusChartInstance.destroy();
  statusChartInstance = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: labels.map(l => l.charAt(0).toUpperCase() + l.slice(1)),
      datasets: [{ data, backgroundColor, borderWidth: 0 }]
    },
    options: {
      plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11 } } } }
    }
  });
}

/* ---------- products ---------- */
async function loadProducts() {
  const products = await api('/products');
  document.getElementById('products-table').innerHTML = products.map(p => `
    <tr>
      <td>${p.name}</td>
      <td>${p.category}</td>
      <td>$${p.price.toFixed(2)}</td>
      <td>${p.stock}</td>
      <td>${p.featured ? '★' : '—'}</td>
      <td>
        <button class="btn" data-edit="${p.id}">Edit</button>
        <button class="btn danger" data-delete="${p.id}">Delete</button>
      </td>
    </tr>`).join('');

  document.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => openProductModal(products.find(p => p.id == b.dataset.edit))));
  document.querySelectorAll('[data-delete]').forEach(b => b.addEventListener('click', async () => {
    if (!confirm('Delete this product?')) return;
    await api(`/products/${b.dataset.delete}`, { method: 'DELETE' });
    loadProducts();
  }));
}

let comboOptionProducts = [];

async function loadComboOptionProducts() {
  const all = await api('/products');
  comboOptionProducts = all.filter(item => item.category !== 'Combos');
}

function comboItemRowHtml(slot) {
  const options = comboOptionProducts.map(item =>
    `<option value="${item.slug}" data-type="${item.type || ''}" ${slot && slot.defaultSlug === item.slug ? 'selected' : ''}>${item.name} (${item.type || 'no type set'})</option>`
  ).join('');
  return `
    <div class="combo-item-row" style="display:flex; gap:8px; margin-bottom:8px; align-items:center;">
      <input type="text" class="combo-slot-label-input" placeholder="Slot label (e.g. Cot)" value="${slot ? slot.slotLabel : ''}" style="flex:1; padding:8px 10px; border:1px solid var(--line); font-size:13px;">
      <select class="combo-slot-product-select" style="flex:1.6; padding:8px 10px; border:1px solid var(--line); font-size:13px;">
        <option value="">-- choose product --</option>
        ${options}
      </select>
      <button type="button" class="btn btn-sm combo-remove-row-btn" style="color:#B23A3A; padding:6px 10px;">×</button>
    </div>`;
}

function addComboItemRow(slot) {
  const container = document.getElementById('combo-items-rows');
  const wrapper = document.createElement('div');
  wrapper.innerHTML = comboItemRowHtml(slot || null);
  container.appendChild(wrapper.firstElementChild);
}

document.getElementById('combo-items-rows').addEventListener('click', (e) => {
  if (e.target.classList.contains('combo-remove-row-btn')) {
    e.target.closest('.combo-item-row').remove();
  }
});

document.getElementById('combo-add-item-btn').addEventListener('click', () => addComboItemRow());

document.getElementById('p-category').addEventListener('input', (e) => {
  const isCombo = e.target.value.trim().toLowerCase() === 'combos';
  document.getElementById('combo-builder-admin').style.display = isCombo ? 'block' : 'none';
});

async function openProductModal(p) {
  document.getElementById('product-error').textContent = '';
  document.getElementById('product-modal-title').textContent = (p && p.id) ? 'Edit product' : (p && p.category === 'Combos' ? 'New combo' : 'New product');
  document.getElementById('p-id').value = p ? p.id : '';
  document.getElementById('p-name').value = p ? p.name : '';
  document.getElementById('p-slug').value = p ? p.slug : '';
  document.getElementById('p-category').value = p ? p.category : '';
  document.getElementById('p-type').value = p ? (p.type || '') : '';
  document.getElementById('p-material').value = p ? p.material : '';
  document.getElementById('p-description').value = p ? p.description : '';
  document.getElementById('p-price').value = p ? p.price : '';
  document.getElementById('p-compare').value = p && p.compare_at_price ? p.compare_at_price : '';
  document.getElementById('p-stock').value = p ? p.stock : 20;
  document.getElementById('p-image').value = p ? p.image : '';
  document.getElementById('p-featured').checked = !!(p && p.featured);

  await loadComboOptionProducts();
  document.getElementById('combo-items-rows').innerHTML = '';
  const isCombo = !!(p && p.category === 'Combos');
  document.getElementById('combo-builder-admin').style.display = isCombo ? 'block' : 'none';
  if (isCombo && Array.isArray(p.comboItems)) {
    p.comboItems.forEach(slot => addComboItemRow(slot));
  }

  document.getElementById('product-modal-bg').classList.add('open');
}

document.getElementById('new-product-btn').addEventListener('click', () => {
  document.getElementById('p-type').closest('.field').style.display = 'block';
  openProductModal(null);
});
document.getElementById('new-combo-btn').addEventListener('click', async () => {
  await openProductModal({
    id: '', name: '', slug: '', category: 'Combos', type: '',
    material: '', description: '', price: '', compare_at_price: null,
    stock: 20, image: '', featured: false, comboItems: []
  });
  addComboItemRow();
  document.getElementById('p-type').closest('.field').style.display = 'none';
});
document.getElementById('product-cancel-btn').addEventListener('click', () => document.getElementById('product-modal-bg').classList.remove('open'));

document.getElementById('product-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const id = document.getElementById('p-id').value;
  const category = document.getElementById('p-category').value.trim();
  const payload = {
    name: document.getElementById('p-name').value.trim(),
    slug: document.getElementById('p-slug').value.trim(),
    category: category,
    type: document.getElementById('p-type').value.trim() || undefined,
    material: document.getElementById('p-material').value.trim(),
    description: document.getElementById('p-description').value.trim(),
    price: parseFloat(document.getElementById('p-price').value),
    compare_at_price: document.getElementById('p-compare').value ? parseFloat(document.getElementById('p-compare').value) : null,
    stock: parseInt(document.getElementById('p-stock').value, 10) || 0,
    image: document.getElementById('p-image').value.trim() || '/images/products/placeholder.svg',
    featured: document.getElementById('p-featured').checked
  };

  if (category.toLowerCase() === 'combos') {
    const rows = document.querySelectorAll('#combo-items-rows .combo-item-row');
    const comboItems = [];
    rows.forEach(row => {
      const label = row.querySelector('.combo-slot-label-input').value.trim();
      const select = row.querySelector('.combo-slot-product-select');
      const slug = select.value;
      const type = select.selectedOptions[0] ? select.selectedOptions[0].dataset.type : '';
      if (label && slug) {
        comboItems.push({ slotLabel: label, optionType: type, defaultSlug: slug });
      }
    });
    payload.comboItems = comboItems;
  }

  try {
    if (id) await api(`/products/${id}`, { method: 'PUT', body: JSON.stringify(payload) });
    else await api('/products', { method: 'POST', body: JSON.stringify(payload) });
    document.getElementById('product-modal-bg').classList.remove('open');
    loadProducts();
  } catch (err) {
    document.getElementById('product-error').textContent = err.message;
  }
});

/* ---------- orders ---------- */
let allOrders = [];
let orderStatusFilter = '';
let orderSearchTerm = '';

async function loadOrders() {
  allOrders = await api('/orders');
  renderOrders();

  document.getElementById('orders-search').oninput = (e) => {
    orderSearchTerm = e.target.value.trim().toLowerCase();
    renderOrders();
  };

  document.getElementById('orders-filters').onclick = (e) => {
    const chip = e.target.closest('.order-filter-chip');
    if (!chip) return;
    document.querySelectorAll('.order-filter-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    orderStatusFilter = chip.dataset.status;
    renderOrders();
  };
}

function renderOrders() {
  let orders = allOrders;

  if (orderStatusFilter) {
    orders = orders.filter(o => o.status === orderStatusFilter);
  }
  if (orderSearchTerm) {
    orders = orders.filter(o =>
      o.customer_name.toLowerCase().includes(orderSearchTerm) ||
      o.customer_email.toLowerCase().includes(orderSearchTerm) ||
      (o.customer_phone || '').includes(orderSearchTerm) ||
      o.id.toLowerCase().includes(orderSearchTerm)
    );
  }

  const listEl = document.getElementById('orders-list');

  if (orders.length === 0) {
    listEl.innerHTML = '<p class="order-empty">No orders match this search/filter.</p>';
    return;
  }

  listEl.innerHTML = orders.map(o => `
    <div class="order-card">
      <div class="order-card-head">
        <div>
          <div class="order-card-id">Order #${o.id}</div>
          <div class="order-card-date">Placed ${new Date(o.created_at).toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' })}</div>
        </div>
        <div class="order-card-total">₹${o.total.toLocaleString('en-IN')}</div>
      </div>
      <div class="order-card-body">
        <div class="order-card-col">
          <div class="order-card-label">Customer</div>
          <div class="order-customer-name">${o.customer_name}</div>
          <div class="order-customer-detail">${o.customer_email}<br>${o.customer_phone || '—'}</div>
        </div>
        <div class="order-card-col">
          <div class="order-card-label">Delivery address</div>
          <div class="order-address">${(o.address || '—').replace(/\n/g, '<br>')}</div>
        </div>
        <div class="order-card-col">
          <div class="order-card-label">Items</div>
          <div class="order-items-list">${o.items.map(i => `${i.name} × ${i.qty}`).join('<br>')}</div>
        </div>
      </div>
      <div class="order-card-footer">
        <span class="payment-badge ${o.payment_status === 'paid' ? 'paid' : 'unpaid'}">
          ${o.payment_status === 'paid' ? '✓ Paid via Razorpay' : 'Not paid online'}
        </span>
        <select class="status-select" data-order="${o.id}">
          ${['pending','processing','shipped','delivered','cancelled'].map(s => `<option value="${s}" ${s === o.status ? 'selected' : ''}>${s.charAt(0).toUpperCase() + s.slice(1)}</option>`).join('')}
        </select>
      </div>
    </div>`).join('');

  document.querySelectorAll('.status-select').forEach(sel => sel.addEventListener('change', async () => {
    await api(`/orders/${sel.dataset.order}/status`, { method: 'PUT', body: JSON.stringify({ status: sel.value }) });
    const order = allOrders.find(o => o.id === sel.dataset.order);
    if (order) order.status = sel.value;
  }));
}

/* ---------- messages ---------- */
async function loadMessages() {
  const rows = await api('/messages');
  document.getElementById('messages-table').innerHTML = rows.map(r => `
    <tr><td>${r.name}</td><td>${r.email}</td><td>${r.message}</td><td>${new Date(r.created_at).toLocaleDateString()}</td></tr>`).join('')
    || '<tr><td colspan="4" style="color:var(--taupe);">No messages yet.</td></tr>';
}
